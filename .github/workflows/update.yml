name: Update jobs and deploy

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC (06:00-07:00 Israel time)
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape boards and build site
        run: python build.py

      - name: Save listings history
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Update listings $(date -u +%F) [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
